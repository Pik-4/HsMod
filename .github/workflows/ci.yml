name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Checkout the repository
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    
    # Build the project
    - name: Build HsMod
      run: dotnet build --configuration Release --no-restore
    
    # Upload the built artifact
    - name: Upload HsMod to artifact
      uses: actions/upload-artifact@v4
      with:
        name: HsMod.dll
        path: HsMod/Release/HsMod.dll

    # Set up Python (new step)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    # Custom step to upload to Telegram
    - name: Upload to Telegram
      env:
        CHAT_ID: ${{ secrets.CHAT_ID }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.event.head_commit.url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TITLE: HsMod
      run: |
        $VERSION = git rev-list --count HEAD
        $HSMOD = Get-ChildItem -Path .\HsMod\Release -Filter HsMod.dll -Recurse | Select-Object -First 1
        python -m pip install --upgrade pip
        python -m pip install telethon
        python .github\scripts\telegram.py $HSMOD.FullName
        
