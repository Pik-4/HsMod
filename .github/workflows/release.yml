name: Auto Release

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@users.noreply.github.com"
        
    - name: Add upstream repository
      run: |
        # 添加上游仓库作为远程仓库
        git remote add upstream https://github.com/Pik-4/HsMod.git
        git fetch upstream
        
    - name: Check for updates
      id: check-updates
      run: |
        # 检查是否有更新
        if git diff --quiet upstream/${{ github.event.repository.default_branch }} ${{ github.event.repository.default_branch }}; then
          echo "没有需要同步的更新"
          echo "has_updates=false" >> $GITHUB_OUTPUT
        else
          echo "检测到上游有更新"
          echo "has_updates=true" >> $GITHUB_OUTPUT
          
          # 记录更新信息
          git log --oneline upstream/${{ github.event.repository.default_branch }} ^${{ github.event.repository.default_branch }} > updates.txt
          echo "UPDATES<<EOF" >> $GITHUB_ENV
          cat updates.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        fi
    - name: Merge upstream changes
      if: steps.check-updates.outputs.has_updates == 'true'
      run: |
        git checkout ${{ github.event.repository.default_branch }}
        
        # 尝试合并，如果冲突则中止
        if ! git merge upstream/${{ github.event.repository.default_branch }} --no-edit; then
          echo "合并冲突，中止同步"
          git merge --abort
          exit 1
        fi
    - name: Push changes
      if: steps.check-updates.outputs.has_updates == 'true'
      run: |
        git push origin ${{ github.event.repository.default_branch }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x




        
    - name: Restore dependencies
      if: steps.check-updates.outputs.has_updates == 'true'
      run: dotnet restore --locked-mode
    - name: Build HsMod
      if: steps.check-updates.outputs.has_updates == 'true'
      run: dotnet build --configuration Release --no-restore
    - name: Generate release tag
      if: steps.check-updates.outputs.has_updates == 'true'
      id: tag
      run: |
        Get-Content ./HsMod/PluginInfo.cs | Select-String -Pattern 'public const string PLUGIN_VERSION = "(.*?)"' | ForEach-Object { ($_ -match '"(.*?)"') | Out-Null }
        $version = $matches[1];
        echo "PLUGIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
    - name: Create Release
      if: steps.check-updates.outputs.has_updates == 'true'
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        CURRENT_TAG: ${{ steps.tag.outputs.PLUGIN_VERSION }}
      with:
        tag_name: ${{ steps.tag.outputs.PLUGIN_VERSION }}
        files: ./HsMod/Release/HsMod.dll
        prerelease: false
        make_latest: true
        generate_release_notes: true
      
